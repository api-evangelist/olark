- aid: olark:javascript-api
  name: Olark JavaScript API
  description: >-
    Browser-side JavaScript API for controlling the Olark chat widget, including chatbox appearance and
    behavior, chat conversations, visitor information, attention grabber, greeter and pre-chat surveys,
    targeted chat rules, and integrations. Authentication is configured via an Olark site identifier passed
    to olark.identify().
