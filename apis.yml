aid: olark
name: Olark
description: >-
  Olark is a live chat and AI-powered customer communication platform that
  enables businesses to engage website visitors in real time through chat,
  chatbots, WhatsApp, and SMS. The platform combines human support with
  CoPilot automation for capturing leads, driving sales, and providing
  24/7 customer service, and is WCAG 2.1 AA accessibility certified.
  Olark exposes a browser-side JavaScript API for embedding and customizing
  the chat widget, plus webhooks and integrations with 100+ external tools.
